<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nueva contraseña · DeclaraFY</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090b12;color:#f5f6fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(430px,100%);background:#121622;border:1px solid #2a3042;border-radius:18px;padding:28px;box-shadow:0 24px 80px #0008}
    h1{margin:0 0 8px;color:#f0b84a;font-size:26px}p{color:#aab0c3;line-height:1.5}
    label{display:block;margin:18px 0 7px;font-weight:600}input{width:100%;padding:13px;border:1px solid #394159;border-radius:9px;background:#0b0e17;color:#fff;font-size:16px}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#e8ad3f;color:#161005;font-weight:800;font-size:16px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}#message{min-height:24px;margin-top:16px}.error{color:#ff7f8e}.success{color:#6bd39b}a{color:#e8ad3f}
  </style>
</head>
<body>
  <main>
    <h1>Nueva contraseña</h1>
    <p>Escribe una contraseña de al menos 8 caracteres.</p>
    <form id="resetForm">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" minlength="8" maxlength="200" required autocomplete="new-password">
      <label for="confirm">Repite la contraseña</label>
      <input id="confirm" type="password" minlength="8" maxlength="200" required autocomplete="new-password">
      <button id="submit" type="submit">Guardar contraseña</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script src="/server-api.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const token = new URLSearchParams(location.search).get('token') || '';
    if (!/^[a-f0-9]{64}$/i.test(token)) {
      form.hidden = true;
      message.className = 'error';
      message.textContent = 'Este enlace no es válido. Solicita uno nuevo desde la página de inicio.';
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 8 || password !== confirm) {
        message.className = 'error';
        message.textContent = password !== confirm ? 'Las contraseñas no coinciden.' : 'Usa al menos 8 caracteres.';
        return;
      }
      const button = document.getElementById('submit');
      button.disabled = true;
      try {
        const data = await declarafyApi('reset_password', {body:{token,password}});
        form.hidden = true;
        message.className = 'success';
        message.innerHTML = `${data.message || 'Contraseña actualizada.'} <a href="/">Ir a iniciar sesión</a>`;
      } catch (error) {
        message.className = 'error';
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
