name: Security check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check secure-index.js
          node --check final-index.js
          node --check config.js
          node --check app.js
          node --check calculators.js
          node --check firebase-sync.js
          node --check scripts/verify-deployment-structure.js
      - name: Run regression and deployment tests
        run: npm test
