name: Security check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check app.js
          node --check server-api.js
          node --check calculators.js
          node --check firebase-sync.js
          node --check scripts/verify-deployment-structure.js
          for file in src/modules/*.js; do node --check "$file"; done
          for file in src/core/*.js; do node --check "$file"; done
      - name: Check PHP syntax
        run: |
          php -l api/bootstrap.php
          php -l api/index.php
          php -l api/config.sample.php
      - name: Set up Python worker tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate hardened worker Compose profile
        run: |
          printf 'synthetic-worker-token' > /tmp/declarafy-worker-token
          printf '{"ci-key":"dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q="}' > /tmp/declarafy-worker-keyring.json
          DECLARAFY_WORKER_TOKEN_FILE=/tmp/declarafy-worker-token \
          DECLARAFY_WORKER_ENCRYPTION_KEYS_JSON_FILE=/tmp/declarafy-worker-keyring.json \
          DECLARAFY_WORKER_ENCRYPTION_ACTIVE_KEY_ID=ci-key \
          docker compose -f worker/docker-compose.hardened.yml config --quiet
      - name: Build isolated worker image
        run: docker build --pull=false --tag declarafy-worker:ci worker
      - name: Install worker dependencies
        run: python -m pip install --requirement worker/requirements.txt
      - name: Run worker security and lifecycle tests
        working-directory: worker
        run: python -m unittest discover -v
      - name: Run regression and deployment tests
        run: npm test
