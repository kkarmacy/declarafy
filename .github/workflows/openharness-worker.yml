name: OpenHarness worker ingress checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/openharness-worker.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt
      - run: python -m unittest discover -s worker -p 'test_*.py' -v
