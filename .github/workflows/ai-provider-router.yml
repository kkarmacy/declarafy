name: AI provider router checks

on:
  pull_request:
    paths:
      - 'api/ai/provider-router.php'
      - 'tests/ai-provider-router.test.php'
      - '.github/workflows/ai-provider-router.yml'
  push:
    branches:
      - main
      - 'feat/multi-ai-provider-routing-pr40'
    paths:
      - 'api/ai/provider-router.php'
      - 'tests/ai-provider-router.test.php'
      - '.github/workflows/ai-provider-router.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l api/ai/provider-router.php
          php -l tests/ai-provider-router.test.php
      - name: Run offline provider tests
        run: php tests/ai-provider-router.test.php
